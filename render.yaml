services:
  # Backend Web Service (FastAPI)
  - type: web
    name: school-connect-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false # Set this in Render Dashboard
      - key: DB_NAME
        value: school_connect
      - key: CORS_ORIGINS
        value: "*" # Update this later with your frontend URL for better security
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: RESEND_API_KEY
        sync: false # Set this in Render Dashboard

  # Frontend Static Site (React)
  - type: static_site
    name: school-connect-ui
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://school-connect-api.onrender.com # Update if your API name differs
