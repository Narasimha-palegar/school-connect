services:
  # Backend Web Service (FastAPI)
  - type: web
    name: school-connect-api
    plan: free # Explicitly using the Free Tier
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: school_connect
      - key: CORS_ORIGINS
        value: "*"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: RESEND_API_KEY
        sync: false

  # Frontend Static Site (React)
  - type: web
    name: school-connect-ui
    plan: free # Explicitly using the Free Tier
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://school-connect-api.onrender.com
